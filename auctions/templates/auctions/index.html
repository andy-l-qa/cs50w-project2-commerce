{% extends "auctions/layout.html" %}

{% block body %}
    <h2>Active Listings</h2>

    <form action="{% url 'display_by_category' %}" method="POST">

        {% csrf_token %}

        <div class="d-flex align-items-end gap-2 my-3">

            <div>

                <label for="category" class="form-label">
                    Choose category
                </label>

                <select name="category"
                        id="category"
                        class="form-select">

                    <option value="" selected>
                        All
                    </option>

                    {% for category in categories %}
                        <option value="{{ category.id }}">
                            {{ category.name }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <button type="submit"
                    class="btn btn-success mx-2">
                Load by Category
            </button>

        </div>

    </form>

    <div class="row mx-2 my-2">
    
        {% for listing in listings %}

        <div class="card mx-2 shadow-sm" style="width: 22rem;">
            
            <img src="{{ listing.image.url }}" 
                class="card-img-top"
                alt="{{ listing.title }}"
                style="height: 220px; object-fit: cover;">

            <div class="card-body">

                <h5 class="card-title">
                    {{ listing.title }}
                </h5>

                <p class="card-text text-muted">
                    {{ listing.description|truncatewords:20 }}
                </p>

                <div class="d-flex justify-content-between align-items-center">

                    <span class="fw-bold text-success fs-5">
                        ${{ listing.price }}
                    </span>

                    {% comment %} <a href="{% url 'listing' listing.id %}" 
                    class="btn btn-primary">
                        View
                    </a> {% endcomment %}

                </div>

            </div>
        </div>

        {% endfor %}

    </div>
    


{% endblock %}
